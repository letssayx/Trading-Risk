<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turtle Terminal - Spread Builder</title>
    <link rel="stylesheet" href="/static/css/spread_builder.css">
    <style>
        body {
            background: #121212;
            margin: 0;
            padding: 20px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #E0E2E8;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        /* Left Sidebar: Watchlist */
        .watchlist-panel {
            background: #1E1F25;
            border: 1px solid #3A3B45;
            border-radius: 6px;
            padding: 10px;
            height: 600px;
            overflow-y: auto;
        }
        .watchlist-header {
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 1px solid #3A3B45;
            margin-bottom: 10px;
        }
        .symbol-item {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
        }
        .symbol-item:hover { background: #2C2D35; }
        .symbol-price { color: #3176B8; font-family: monospace; }

        /* Main Builder Area */
        .builder-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Formula Input Area */
        .formula-container {
            background: #1E1F25;
            border: 1px solid #3A3B45;
            border-radius: 6px;
            padding: 20px;
        }

        .formula-input {
            width: 100%;
            background: #25262D;
            border: 1px solid #4A4B55;
            color: #E0E2E8;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        /* Calculator Keypad */
        .keypad {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .key-btn {
            background: #2C2D35;
            border: 1px solid #4A4B55;
            color: #E0E2E8;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.1s;
        }
        .key-btn:hover { background: #3A3B45; transform: translateY(-1px); }
        .key-btn:active { transform: translateY(1px); }
        .key-btn.action { background: #60a5fa; color: #000; border: none; }

        /* Result Display */
        .result-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #25262D;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
        }
        .spread-val { font-size: 24px; font-weight: bold; color: #3176B8; }

        /* Chart Placeholder */
        .chart-placeholder {
            background: #1E1F25;
            border: 1px solid #3A3B45;
            border-radius: 6px;
            height: 400px;
            display: flex;
            flex-direction: column;
            color: #666;
            position: relative;
        }

        .chart-toolbar {
            padding: 10px;
            border-bottom: 1px solid #3A3B45;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .chart-canvas {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- Watchlist -->
        <div class="watchlist-panel">
            <div class="watchlist-header">MARKET WATCH</div>
            <div id="watchlist-list">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Builder -->
        <div class="builder-panel">
            <div class="formula-container">
                <div style="margin-bottom:10px; color:#888; font-size:0.9em;">SPREAD FORMULA</div>
                <input type="text" class="formula-input" id="formula-input" placeholder="e.g. NIFTY - BANKNIFTY * 0.5">

                <div class="keypad">
                    <button class="key-btn" onclick="insertToken('+')">+</button>
                    <button class="key-btn" onclick="insertToken('-')">-</button>
                    <button class="key-btn" onclick="insertToken('*')">*</button>
                    <button class="key-btn" onclick="insertToken('/')">/</button>
                    <button class="key-btn" onclick="insertToken('(')">(</button>
                    <button class="key-btn" onclick="insertToken(')')">)</button>
                    <button class="key-btn action" onclick="calculateSpread()">CALCULATE</button>
                    <button class="key-btn" style="background:#f44336; border:none;" onclick="clearFormula()">CLR</button>
                </div>

                <div class="result-box">
                    <span>LIVE SPREAD VALUE:</span>
                    <span class="spread-val" id="spread-value">--</span>
                </div>

                <div style="margin-top:15px; text-align:right;">
                    <button class="key-btn" id="plot-chart-btn" style="background:#2C2D35; border:1px solid #4A4B55;">📊 PLOT CHART</button>
                </div>
            </div>

            <div class="chart-placeholder" id="spread-chart-area">
                <div class="chart-toolbar">
                    <button class="key-btn" style="font-size:12px; padding:5px 10px;" id="add-indicator-btn">+ Add Indicator</button>
                </div>
                <div class="chart-canvas" id="chart-canvas">
                    [ SPREAD CHART AREA ]
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/spread_builder.js"></script>
    <script>
        // Init logic moved to spread_builder.js but we can trigger it here if needed
        // The script is loaded at the end of body
    </script>
</body>
</html>
