<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turtle AI Chat</title>
    <!-- Use similar head elements as workbench -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #0e0e10;
            --panel-bg: #18181b;
            --border-color: #2d2d30;
            --text-color: #d1d5db;
            --accent-color: #3b82f6;
            --chat-user: #2d3748;
            --chat-ai: #1f2937;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .left-sidebar {
            width: 250px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar {
            width: 300px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-buttons {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-btn {
            background: #2d3748;
            border: 1px solid #4a5568;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover {
            background: #4a5568;
        }

        .logs-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            font-family: monospace;
            font-size: 0.85em;
            color: #9ca3af;
        }

        .log-entry {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .log-entry .log-node {
            color: #60a5fa;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-color);
            align-items: center;
        }

        .chat-header {
            width: 100%;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            background: var(--panel-bg);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .chat-container-inner {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .message {
            max-width: 85%;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .msg-user {
            background: var(--chat-user);
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .msg-ai {
            background: var(--chat-ai);
            align-self: flex-start;
            border-bottom-left-radius: 0;
            width: 100%;
        }

        .chat-input-container {
            width: 100%;
            padding: 20px;
            background: var(--bg-color);
            box-sizing: border-box;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .quick-actions::-webkit-scrollbar {
            height: 4px;
        }

        .quick-actions::-webkit-scrollbar-thumb {
            background: #555;
        }

        .action-btn {
            background: #2d3748;
            border: 1px solid #4a5568;
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: #4a5568;
        }

        .input-box {
            display: flex;
            gap: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 5px;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button.send-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button.send-btn:hover {
            background: #2563eb;
        }

        /* Excel-like Table Styles */
        .excel-table-wrapper {
            margin-top: 10px;
            margin-bottom: 5px;
            width: 100%;
            overflow-x: auto;
        }

        .excel-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
            border: none;
            background: transparent;
        }

        .excel-table th {
            color: var(--accent-color);
            padding: 6px 10px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        .excel-table td {
            padding: 6px 10px;
            border-bottom: 1px solid #333;
            text-align: left;
        }

        .excel-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .table-actions {
            padding: 6px 0;
            display: flex;
            justify-content: flex-end;
            border-bottom: none;
            background: transparent;
        }

        .table-actions button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .table-actions button:hover {
            background: #45a049;
        }

    </style>
</head>
<body>

    <!-- Left Sidebar -->
    <div class="left-sidebar">
        <div class="sidebar-header">
            <span><i class="fas fa-terminal"></i> Workspaces</span>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="prefillPrompt('Dividend analysis for: ')"><i class="fas fa-money-bill-wave text-accent"></i> Dividend Analysis</button>
            <button class="nav-btn" onclick="prefillPrompt('OI analysis for: ')"><i class="fas fa-chart-bar text-accent"></i> OI Analysis</button>
            <button class="nav-btn" onclick="prefillPrompt('Market activity for: ')"><i class="fas fa-globe text-accent"></i> Market Activity</button>
            <button class="nav-btn" onclick="prefillPrompt('Rollover analysis for: ')"><i class="fas fa-sync text-accent"></i> Rollover Analysis</button>
            <button class="nav-btn" onclick="prefillPrompt('Put-Call Parity for: ')"><i class="fas fa-balance-scale text-accent"></i> Put-Call Parity</button>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="main-chat">
        <div class="chat-header">
            <span>
                Turtle AI Terminal
            </span>
            <span>
                <i class="fas fa-robot text-accent"></i> Online
                <button onclick="document.getElementById('sidebar').style.display=document.getElementById('sidebar').style.display==='none'?'flex':'none'" style="background:none;border:none;color:white;cursor:pointer;margin-left:15px;font-size:1.1em;" title="Toggle System Log"><i class="fas fa-terminal"></i></button>
            </span>
        </div>

        <div class="chat-container-inner">
            <div class="chat-messages" id="chat-messages">
                <div class="message msg-ai">
                    Hello! I am ready to analyze the markets for you. What would you like to investigate today?
                </div>
            </div>

            <div class="chat-input-container">
                <div class="quick-actions">
                    <button class="action-btn" onclick="quickSend('Dividend analysis for Reliance')">Reliance Dividends</button>
                    <button class="action-btn" onclick="quickSend('Upcoming board meetings this week')">Upcoming Meetings</button>
                    <button class="action-btn" onclick="quickSend('Dividend opportunity in July')">July Div Opportunities</button>
                </div>
                <div class="input-box">
                    <input type="text" id="chat-input" placeholder="Ask about dividends, OI, market activity..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Verification / Thought Process Sidebar (Now on Right) -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span><i class="fas fa-microchip"></i> System Log</span>
            <button onclick="document.getElementById('sidebar').style.display='none'" style="background:none;border:none;color:white;cursor:pointer;"><i class="fas fa-times"></i></button>
        </div>
        <div class="logs-container" id="logs-feed">
            <div class="log-entry">
                <div class="log-node">[SYSTEM]</div>
                <div>Ready for commands.</div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let tableCounter = 0;
        let chatHistory = []; // Array to store recent chat history for context

        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/ai-analyze`);

            ws.onopen = () => {
                logMessage("[SYSTEM]", "WebSocket Connected", "#4caf50");
                updateWebSocketHandler(); // Call to set up the robust streaming handler
            };

            ws.onclose = () => {
                logMessage("[SYSTEM]", "WebSocket Disconnected. Reconnecting in 5s...", "#ff4d4d");
                setTimeout(connectWS, 5000);
            };
        }

        function logMessage(node, text, color) {
            const feed = document.getElementById('logs-feed');
            feed.innerHTML += `
                <div class="log-entry">
                    <div class="log-node" style="color:${color}">${node}</div>
                    <div>${text}</div>
                </div>
            `;
            feed.scrollTop = feed.scrollHeight;
        }

        function addUserMessage(text) {
            const msgs = document.getElementById('chat-messages');
            msgs.innerHTML += `<div class="message msg-user">${text}</div>`;
            msgs.scrollTop = msgs.scrollHeight;
            chatHistory.push({ role: 'user', content: text });
            if (chatHistory.length > 20) chatHistory.shift();
        }

        function addAIMessage(text, isHtml = false) {
            const msgs = document.getElementById('chat-messages');
            if (isHtml) {
                msgs.innerHTML += `<div class="message msg-ai">${text}</div>`;
            } else {
                msgs.innerHTML += `<div class="message msg-ai" style="white-space: pre-wrap;">${text}</div>`;
            }
            msgs.scrollTop = msgs.scrollHeight;
            // Only add text to history, avoid large HTML blobs directly if possible
            if (!isHtml) {
                chatHistory.push({ role: 'assistant', content: text });
                if (chatHistory.length > 20) chatHistory.shift();
            }
        }

        function quickSend(text) {
            document.getElementById('chat-input').value = text;
            sendMessage();
        }

        function prefillPrompt(text) {
            const input = document.getElementById('chat-input');
            input.value = text;
            input.focus();

            // Add a conversational tip from the AI
            addAIMessage(`Got it. Please specify the stock, date range, or any specific filters you'd like to apply for the ${text.replace(' for: ', '')}.`);
        }

        function setThinkingState(message) {
            let thinkingDiv = document.getElementById('ai-thinking');
            if (!thinkingDiv) {
                const msgs = document.getElementById('chat-messages');
                thinkingDiv = document.createElement('div');
                thinkingDiv.id = 'ai-thinking';
                thinkingDiv.className = 'message msg-ai';
                thinkingDiv.style.opacity = '0.7';
                thinkingDiv.style.fontStyle = 'italic';
                thinkingDiv.style.fontSize = '0.9em';
                msgs.appendChild(thinkingDiv);
            }
            thinkingDiv.innerHTML = `<i class="fas fa-spinner fa-spin" style="margin-right: 5px;"></i> ${message}`;

            const msgs = document.getElementById('chat-messages');
            msgs.scrollTop = msgs.scrollHeight;
        }

        function clearThinkingState() {
            const thinkingDiv = document.getElementById('ai-thinking');
            if (thinkingDiv) {
                thinkingDiv.remove();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const cmd = input.value.trim();
            if (!cmd) return;

            // Use hardcoded keys or try to get from session if available locally
            // In production, keys should ideally be securely handled backend-side
            const groqKey = localStorage.getItem('GROQ_API_KEY') || "";
            const openrouterKey = localStorage.getItem('OPENROUTER_API_KEY') || "";
            const googleKey = localStorage.getItem('GOOGLE_API_KEY') || "";

            addUserMessage(cmd);
            input.value = '';
            input.disabled = true;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    command: cmd,
                    keys: { groq: groqKey, openrouter: openrouterKey, google: googleKey },
                    session_id: "chat_user_01",
                    history: chatHistory.slice(-10) // Send last 10 messages for context
                }));
                logMessage("[SYSTEM]", `Sent command: ${cmd}`, "#aaa");
            } else {
                addAIMessage("Connection not available. Trying to reconnect...");
                connectWS();
                input.disabled = false;
            }
        }

        // Widget Renderer Logic
        async function renderWidget(widgetData) {
            logMessage("[WIDGET]", `Rendering ${widgetData.widget}`, "#3b82f6");

            // Strictly NO AI intro or summary text, just render the widget
            let html = ``;

            if (widgetData.widget === "dividend_table") {
                // Fetch the deterministic data from backend
                try {
                    const params = new URLSearchParams();
                    if(widgetData.symbols) widgetData.symbols.forEach(s => params.append("symbol", s));
                    if(widgetData.months) widgetData.months.forEach(m => params.append("month", m));
                    if(widgetData.upcoming) params.append("upcoming", "true");

                    const res = await fetch(`/api/chat-widgets/dividend?${params.toString()}`);
                    const data = await res.json();

                    if (!data || data.length === 0) {
                        html += `<div>No dividend records found matching those parameters.</div>`;
                    } else {
                        tableCounter++;
                        const tableId = `tbl-${tableCounter}`;

                        // Store summary in chat history so the AI knows what data was returned
                        const dataSummary = JSON.stringify(data.slice(0, 15)); // Keep it concise
                        chatHistory.push({ role: 'assistant', content: `[DATA_WIDGET_RETURNED: ${dataSummary}]` });

                        html += `
                        <div class="excel-table-wrapper">
                            <div class="table-actions" style="gap: 10px;">
                                <button onclick="analyzeWidgetData('${tableId}')" style="background: #3b82f6;"><i class="fas fa-brain"></i> Analyze</button>
                                <button onclick="exportXLSX('${tableId}', 'Dividend_Data')"><i class="fas fa-file-excel"></i> Export XLSX</button>
                            </div>
                            <table class="excel-table" id="${tableId}">
                                <thead>
                                    <tr>
                                        ${Object.keys(data[0]).map(k => `<th>${k}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.map((row, idx) => `
                                        <tr class="row-${tableId}" style="${idx >= 10 ? 'display:none;' : ''}">
                                            ${Object.values(row).map(v => `<td>${v !== null ? v : '-'}</td>`).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                            ${data.length > 10 ? `
                            <div style="text-align: center; padding: 10px; background: var(--chat-ai); border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 8px 8px;">
                                <button onclick="toggleRows('${tableId}')" style="background: transparent; color: #4caf50; border: 1px solid #4caf50; padding: 5px 15px; border-radius: 15px; cursor: pointer; font-size: 13px; font-weight: bold;">Show More (${data.length - 10})</button>
                            </div>` : ''}
                        </div>`;

                        // Store raw data in window for export
                        window[`data_${tableId}`] = data;
                    }

                } catch(e) {
                    html += `<div style="color:red;">Error fetching widget data: ${e.message}</div>`;
                }
            }

            addAIMessage(html, true);
        }

        function toggleRows(tableId) {
            const rows = document.querySelectorAll(`.row-${tableId}`);
            let isHidden = false;
            rows.forEach((r, idx) => {
                if (idx >= 10) {
                    if (r.style.display === 'none') {
                        r.style.display = 'table-row';
                        isHidden = true;
                    } else {
                        r.style.display = 'none';
                    }
                }
            });

            const btn = event.target;
            if (isHidden) {
                btn.innerText = 'Show Less';
            } else {
                btn.innerText = `Show More (${rows.length - 10})`;
            }
        }

        function analyzeWidgetData(tableId) {
            const data = window[`data_${tableId}`];
            if (!data) return;

            const groqKey = localStorage.getItem('GROQ_API_KEY') || "";
            const openrouterKey = localStorage.getItem('OPENROUTER_API_KEY') || "";
            const googleKey = localStorage.getItem('GOOGLE_API_KEY') || "";

            const cmd = "ANALYZE_WIDGET_DATA|" + JSON.stringify(data.slice(0, 50)); // Send up to 50 rows

            addUserMessage("Please analyze the data in the table above.");
            document.getElementById('chat-input').disabled = true;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    command: cmd,
                    keys: { groq: groqKey, openrouter: openrouterKey, google: googleKey },
                    session_id: "chat_user_01",
                    history: chatHistory.slice(-10)
                }));
                logMessage("[SYSTEM]", `Sent direct widget analysis request.`, "#aaa");
            }
        }

        function exportXLSX(tableId, filename) {
            const data = window[`data_${tableId}`];
            if (!data) return;

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data");
            XLSX.writeFile(wb, `${filename}.xlsx`);
        }

        // Handle streaming text explicitly
        let activeStreamMessage = null;

        const originalOnMessage = ws ? ws.onmessage : null;
        function updateWebSocketHandler() {
            if (!ws) return;
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                if (msg.type === "text_stream_start") {
                    clearThinkingState();
                    const msgs = document.getElementById('chat-messages');
                    activeStreamMessage = document.createElement('div');
                    activeStreamMessage.className = 'message msg-ai';
                    activeStreamMessage.style.whiteSpace = 'pre-wrap';
                    msgs.appendChild(activeStreamMessage);
                    msgs.scrollTop = msgs.scrollHeight;
                } else if (msg.type === "text_stream") {
                    if (activeStreamMessage) {
                        activeStreamMessage.innerHTML += msg.token;
                        const msgs = document.getElementById('chat-messages');
                        msgs.scrollTop = msgs.scrollHeight;
                    }
                } else if (msg.type === "text_stream_end") {
                    if (activeStreamMessage) {
                        chatHistory.push({ role: 'assistant', content: activeStreamMessage.innerText });
                        activeStreamMessage = null;
                        document.getElementById('chat-input').disabled = false;
                    }
                } else {
                    // Fallback to original handling logic if it's not a stream
                    if (msg.type === "status") {
                        logMessage("[STATUS]", msg.message, "#aaa");
                        setThinkingState(msg.message);
                    } else if (msg.type === "jules_task") {
                        logMessage("[JULES]", msg.reasoning || "Task created", "#00bcd4");
                    } else if (msg.type === "qwen_extract") {
                        logMessage("[QWEN]", msg.reasoning || "Data extracted", "#e6a23c");
                    } else if (msg.type === "deepseek_logic") {
                        logMessage("[DEEPSEEK]", "Executing quant logic...", "#818cf8");
                    } else if (msg.type === "llama_judge") {
                        logMessage("[JUDGE]", "Verifying constraints...", "#b8860b");
                    } else if (msg.type === "result") {
                        clearThinkingState();
                        try {
                            const parsed = JSON.parse(msg.message);
                            if (parsed.widget) {
                                renderWidget(parsed);
                            } else {
                                addAIMessage(msg.message);
                            }
                        } catch(e) {
                            addAIMessage(msg.message);
                        }
                        document.getElementById('chat-input').disabled = false;
                    } else if (msg.type === "execution") {
                        clearThinkingState();
                        addAIMessage("Execution Recommended:\n" + JSON.stringify(msg.data, null, 2));
                        document.getElementById('chat-input').disabled = false;
                    } else if (msg.type === "error") {
                        clearThinkingState();
                        logMessage("[ERROR]", msg.message, "#ff4d4d");
                        addAIMessage("Error: " + msg.message);
                        document.getElementById('chat-input').disabled = false;
                    }
                }
            };
        }

        // Initialize
        connectWS();
    </script>
</body>
</html>
