<!-- Risk Scenario Card Template -->
<div class="risk-card {{ severity_class }}">
  <div class="card-header">
    <h3>{{ scenario_name }}</h3>
    <span class="impact-value">{{ pnl_impact }}</span>
  </div>
  <div class="card-body">
    <p>{{ description }}</p>
    <div class="progress-bar">
      <div class="fill" style="width: {{ impact_pct }}%;"></div>
    </div>
  </div>
</div>
