<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Historical Data Explorer - Turtle Terminal</title>
    <link rel="stylesheet" href="/static/css/workbench.css">
    <style>
        body { padding: 20px; overflow: hidden; height: 100vh; display: flex; flex-direction: column; background: #1e1e1e; color: #ccc; }
        .controls {
            padding: 15px;
            background: #252526;
            border-bottom: 1px solid #333;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .control-group { display: flex; align-items: center; gap: 5px; }
        .control-group label { font-size: 0.85em; color: #aaa; }

        input, select {
            background: #3c3c3c;
            color: #ccc;
            border: 1px solid #555;
            padding: 5px 8px;
            border-radius: 3px;
        }

        .btn { padding: 6px 12px; border: none; border-radius: 3px; cursor: pointer; font-size: 0.9em; }
        .btn-primary { background: #007acc; color: white; }
        .btn-primary:hover { background: #0062a3; }
        .btn-secondary { background: #3c3c3c; color: #ccc; }

        .table-container { flex: 1; overflow: auto; position: relative; }

        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85em; white-space: nowrap; }
        .data-table th, .data-table td { border: 1px solid #333; padding: 6px 10px; text-align: left; }
        .data-table th { background: #2d2d2d; position: sticky; top: 0; z-index: 10; font-weight: 600; color: #ddd; }
        .data-table tr:nth-child(even) { background: #252526; }
        .data-table tr:hover { background: #37373d; }

        .status-bar {
            padding: 5px 15px;
            background: #007acc;
            color: white;
            font-size: 0.8em;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div style="padding: 10px 15px; background: #333; font-weight: bold; font-size: 1.1em; display: flex; justify-content: space-between; align-items: center;">
        <span>Historical Data Explorer</span>
        <button onclick="window.location.href='/workbench'" class="btn btn-secondary" style="font-size: 0.8em;">Back to Workbench</button>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Data Type:</label>
            <select id="data-type" onchange="updateControls()">
                <option value="bhavcopy">Legacy Bhavcopy (Search)</option>
                <option value="bhavcopy_eq">Equity Bhavcopy (New)</option>
                <option value="bhavcopy_fo">F&O Bhavcopy (New)</option>
                <option value="fao_participant_oi">Participant OI</option>
                <option value="fo_volatility">F&O Volatility</option>
                <option value="fii_stats">FII Derivatives Stats</option>
                <option value="var_stats">VaR Stats</option>
                <option value="contract_delta">Contract Delta</option>
                <option value="bulk_deals">Bulk Deals</option>
                <option value="block_deals">Block Deals</option>
                <option value="mto">MTO Delivery</option>
                <option value="mwpl">MWPL Position</option>
                <option value="pe_ratio">P/E Ratio</option>
                <option value="margin_trading">Margin Trading</option>
                <option value="security_master">Security Master</option>
            </select>
        </div>

        <div class="control-group" id="symbol-group">
            <label>Symbol:</label>
            <input type="text" id="symbol-input" placeholder="e.g. RELIANCE">
        </div>

        <div class="control-group">
            <label>From:</label>
            <input type="date" id="start-date">
        </div>
        <div class="control-group">
            <label>To:</label>
            <input type="date" id="end-date">
        </div>

        <button onclick="loadData()" class="btn btn-primary">Load Data</button>
        <button onclick="exportData()" class="btn btn-secondary">Export CSV</button>
    </div>

    <div class="table-container">
        <table class="data-table">
            <thead id="table-head">
                <!-- Dynamic headers -->
            </thead>
            <tbody id="table-body">
                <!-- Dynamic rows -->
            </tbody>
        </table>
    </div>

    <div class="status-bar">
        <span id="status-msg">Ready</span>
        <span id="row-count">0 Rows</span>
    </div>

    <script>
        // Set default dates
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('end-date').value = today;

        function updateControls() {
            const type = document.getElementById('data-type').value;
            const symbolGroup = document.getElementById('symbol-group');

            // Hide Symbol for types that don't need it or show it optional
            // Types without symbol: participant_oi, fii_stats
            if (['fao_participant_oi', 'fii_stats'].includes(type)) {
                symbolGroup.style.display = 'none';
                document.getElementById('symbol-input').value = '';
            } else {
                symbolGroup.style.display = 'flex';
            }
        }

        async function loadData() {
            const type = document.getElementById('data-type').value;
            const symbol = document.getElementById('symbol-input').value.trim();
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;

            // Validations
            if (type === 'bhavcopy' && !symbol) {
                alert("Symbol is required for Legacy Bhavcopy search.");
                return;
            }

            document.getElementById('status-msg').innerText = "Loading...";
            const tbody = document.getElementById('table-body');
            const thead = document.getElementById('table-head');
            tbody.innerHTML = '';
            thead.innerHTML = '';

            try {
                let url = '';
                if (type === 'bhavcopy') {
                    url = `/api/data/view/search?symbol=${symbol}&limit=500`;
                } else {
                    url = `/api/data/view/list?type=${type}&limit=500`;
                    if (symbol) url += `&symbol=${symbol}`;
                    if (start) url += `&start_date=${start}`;
                    if (end) url += `&end_date=${end}`;
                }

                const res = await fetch(url);
                if (!res.ok) throw new Error(await res.text());
                const data = await res.json();

                if (data.length === 0) {
                    document.getElementById('status-msg').innerText = "No data found.";
                    document.getElementById('row-count').innerText = "0 Rows";
                    return;
                }

                // Generate Headers from first row keys
                const keys = Object.keys(data[0]);
                const trHead = document.createElement('tr');
                keys.forEach(key => {
                    const th = document.createElement('th');
                    th.innerText = formatHeader(key);
                    trHead.appendChild(th);
                });
                thead.appendChild(trHead);

                // Generate Rows
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    keys.forEach(key => {
                        const td = document.createElement('td');
                        let val = row[key];
                        if (val === null || val === undefined) val = '-';
                        // Format numbers
                        if (typeof val === 'number') {
                             if (Number.isInteger(val)) {
                                 td.innerText = val.toLocaleString();
                             } else {
                                 td.innerText = val.toFixed(2);
                             }
                             td.style.textAlign = 'right';
                        } else {
                            td.innerText = val;
                        }
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });

                document.getElementById('status-msg').innerText = `Loaded data for ${type}`;
                document.getElementById('row-count').innerText = `${data.length} Rows`;

            } catch (e) {
                document.getElementById('status-msg').innerText = "Error: " + e.message;
                console.error(e);
            }
        }

        function formatHeader(key) {
            // Convert snake_case to Title Case
            return key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        function exportData() {
            // Simple CSV export of current table
            const table = document.querySelector(".data-table");
            if (!table || table.rows.length === 0) return;

            let csv = [];
            for (let i = 0; i < table.rows.length; i++) {
                let row = [], cols = table.rows[i].querySelectorAll("td, th");
                for (let j = 0; j < cols.length; j++)
                    row.push('"' + cols[j].innerText + '"');
                csv.push(row.join(","));
            }

            const blob = new Blob([csv.join("\n")], { type: "text/csv" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `data_export_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        // Init
        updateControls();
    </script>
</body>
</html>
