<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jules Sovereign Workbench - Slate & Carbon</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2d2d2d;
            --border-color: #424242;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --accent-color: #00bcd4;
            --header-height: 40px;
            --palette-width: 280px;
        }
        body { margin: 0; font-family: 'Consolas', 'Segoe UI', monospace; background: var(--bg-color); color: var(--text-primary); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Top Menu Bar */
        #menu-bar { height: var(--header-height); background: #121212; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 15px; font-size: 0.85em; user-select: none; }
        .brand { font-weight: bold; color: var(--accent-color); margin-right: 30px; letter-spacing: 1px; cursor: default; }
        .menu-item { margin-right: 20px; cursor: pointer; color: var(--text-secondary); transition: color 0.2s; position: relative; }
        .menu-item:hover { color: #fff; }
        .menu-item:active { top: 1px; }

        /* Workbench Tabs */
        #wb-tabs { display: flex; align-items: center; margin-left: auto; }
        .wb-tab { padding: 5px 12px; background: #222; border: 1px solid #333; margin-left: 5px; border-radius: 2px; cursor: pointer; font-size: 0.8em; color: #888; }
        .wb-tab.active { background: var(--panel-bg); border-color: var(--accent-color); color: #fff; }

        /* Main Layout */
        #app-body { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* Institutional Sidebar (Collapsible) */
        #alpha-palette { width: 0; background: #181818; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: width 0.3s cubic-bezier(0.4,0,0.2,1); overflow: hidden; white-space: nowrap; }
        #alpha-palette.open { width: var(--palette-width); }
        .palette-header { padding: 12px; background: #121212; color: var(--accent-color); font-weight: bold; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .palette-content { flex: 1; overflow-y: auto; padding: 10px; }

        .tool-category { font-size: 0.75em; color: #666; margin-top: 15px; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; border-bottom: 1px solid #333; padding-bottom: 2px; }
        .tool-brick { background: #252525; border: 1px solid #333; padding: 8px 10px; margin-bottom: 6px; border-radius: 2px; cursor: pointer; font-size: 0.85em; display: flex; align-items: center; transition: all 0.2s; }
        .tool-brick:hover { background: #333; border-color: var(--accent-color); transform: translateX(2px); }
        .brick-icon { margin-right: 10px; opacity: 0.8; font-size: 1.1em; width: 20px; text-align: center; }

        /* Multi-Grid Canvas */
        #canvas-area { flex: 1; background: var(--bg-color); position: relative; padding: 10px; overflow: auto; display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; grid-auto-rows: minmax(200px, auto); }
        .canvas-widget { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 4px; display: flex; flex-direction: column; position: relative; grid-column: span 6; grid-row: span 1; transition: box-shadow 0.2s; }
        .canvas-widget:hover { box-shadow: 0 0 5px rgba(0,0,0,0.5); border-color: #555; }
        .widget-header { padding: 6px 10px; background: #222; border-bottom: 1px solid #333; font-size: 0.8em; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: move; }
        .widget-controls span { cursor: pointer; margin-left: 8px; color: #666; }
        .widget-controls span:hover { color: #fff; }
        .widget-body { flex: 1; overflow: hidden; position: relative; padding: 0; }

        /* Floating Action Button for Palette */
        #fab-palette { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 20px; height: 60px; background: #333; border: 1px solid #444; border-left: none; border-radius: 0 4px 4px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--accent-color); z-index: 1000; transition: left 0.3s; }
        #alpha-palette.open + #canvas-area #fab-palette { left: var(--palette-width); } /* Not strictly needed if flex, but good for overlay */

        /* Jules Drawer */
        #jules-drawer { width: 300px; background: #151515; border-left: 1px solid var(--border-color); display: flex; flex-direction: column; transition: transform 0.3s; position: fixed; right: 0; top: var(--header-height); bottom: 0; transform: translateX(100%); z-index: 2000; }
        #jules-drawer.open { transform: translateX(0); }

    </style>
</head>
<body>

    <div id="menu-bar">
        <div class="brand">TURTLE WORKBENCH</div>
        <div class="menu-item" onclick="mockAction('File/Data Menu')">FILE / DATA</div>
        <div class="menu-item" onclick="mockAction('Analytics Menu')">ANALYTICS</div>
        <div class="menu-item" onclick="mockAction('View Menu')">VIEW</div>

        <div id="wb-tabs">
            <div class="wb-tab active">Macro</div>
            <div class="wb-tab">Vol Arb</div>
            <div class="wb-tab">Risk Audit</div>
            <div class="wb-tab" style="color:var(--accent-color)">+</div>
        </div>

        <div class="menu-item" style="margin-left:20px; font-size:1.2em;" onclick="toggleJules()">🤖</div>
    </div>

    <div id="app-body">
        <!-- Institutional Sidebar -->
        <div id="alpha-palette" class="open">
            <div class="palette-header">
                <span>INSTITUTIONAL SIDEBAR</span>
                <span style="cursor:pointer; opacity:0.6;" onclick="togglePalette()">«</span>
            </div>
            <div class="palette-content" id="palette-list">
                <div style="text-align:center; color:#555; padding:20px;">Loading Tools...</div>
            </div>
        </div>

        <!-- Multi-Grid Canvas -->
        <div id="canvas-area">
            <!-- Widgets spawned dynamically -->
        </div>
    </div>

    <!-- Jules Drawer -->
    <div id="jules-drawer">
        <div style="padding:10px; border-bottom:1px solid #333; font-weight:bold; color:var(--accent-color);">JULES PYTHON HUB</div>
        <div style="flex:1; padding:10px; font-family:monospace; color:#0f0; font-size:0.85em;">
            > System Ready.<br>
            > Alpha Palette Loaded.<br>
            > Monitoring Canvas...
        </div>
    </div>

    <script>
        // State
        let paletteOpen = true;
        let julesOpen = false;

        function togglePalette() {
            const p = document.getElementById('alpha-palette');
            paletteOpen = !paletteOpen;
            p.className = paletteOpen ? 'open' : '';
        }

        function toggleJules() {
            const j = document.getElementById('jules-drawer');
            julesOpen = !julesOpen;
            j.className = julesOpen ? 'open' : '';
        }

        function mockAction(name) {
            console.log(`Menu Action: ${name}`);
            alert(`${name} - functionality coming soon.`);
        }

        async function loadRegistry() {
            try {
                const res = await fetch('/strategies/toolbox/registry');
                if (!res.ok) throw new Error("API Error");
                const data = await res.json();
                renderPalette(data.tools);
            } catch(e) {
                console.error(e);
                document.getElementById('palette-list').innerHTML = `<div style="color:red; text-align:center;">Registry Error</div>`;
            }
        }

        function renderPalette(tools) {
            const container = document.getElementById('palette-list');
            container.innerHTML = '';

            // New Category Mapping
            const groups = {
                "Strategy": "STRATEGIES",
                "Risk": "RISK SCORECARD",
                "Indicator": "ARBITRAGE SCANNER",
                "Governance": "PnL AUDIT",
                "Math": "UTILS"
            };

            const bucketed = {};
            tools.forEach(t => {
                const grp = groups[t.category] || "MISC";
                if (!bucketed[grp]) bucketed[grp] = [];
                bucketed[grp].push(t);
            });

            const order = ["PnL AUDIT", "ARBITRAGE SCANNER", "RISK SCORECARD", "STRATEGIES", "UTILS"];

            order.forEach(grpName => {
                if (!bucketed[grpName]) return;

                const catHeader = document.createElement('div');
                catHeader.className = 'tool-category';
                catHeader.innerText = grpName;
                container.appendChild(catHeader);

                bucketed[grpName].forEach(tool => {
                    const el = document.createElement('div');
                    el.className = 'tool-brick';
                    el.innerHTML = `<span class="brick-icon">${tool.icon}</span> ${tool.title}`;
                    el.onclick = () => spawnWidget(tool);
                    container.appendChild(el);
                });
            });
        }

        function spawnWidget(tool) {
            const grid = document.getElementById('canvas-area');
            const id = 'w-' + Date.now();

            const widget = document.createElement('div');
            widget.className = 'canvas-widget';
            widget.id = id;

            // Default size/pos logic (simple stacking)
            widget.style.gridColumn = "span 6";
            widget.style.gridRow = "span 2";

            widget.innerHTML = `
                <div class="widget-header">
                    <span>${tool.title.toUpperCase()}</span>
                    <div class="widget-controls">
                        <span onclick="toggleCode('${tool.title}')">Code</span>
                        <span onclick="document.getElementById('${id}').remove()">×</span>
                    </div>
                </div>
                <div class="widget-body" id="body-${id}">
                    <div style="padding:20px; text-align:center; color:#666;">
                        Loading ${tool.title}...
                    </div>
                </div>
            `;

            grid.appendChild(widget);

            // Fetch Data
            loadWidgetData(tool, `body-${id}`);
        }

        async function loadWidgetData(tool, containerId) {
            try {
                const res = await fetch('/api/widgets/data', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ tool_name: tool.title })
                });
                const data = await res.json();

                const container = document.getElementById(containerId);

                if (data.type === 'chart') {
                    // Render Chart
                    container.innerHTML = '';
                    const chart = LightweightCharts.createChart(container, {
                        width: container.clientWidth,
                        height: container.clientHeight,
                        layout: { background: { color: '#2d2d2d' }, textColor: '#ccc' },
                        grid: { vertLines: { color: '#333'}, horzLines: { color: '#333'} }
                    });
                    const series = chart.addCandlestickSeries();
                    series.setData(data.data);
                } else if (data.type === 'metrics') {
                    container.innerHTML = `<pre style="padding:10px; color:#0f0; font-size:0.8em;">${JSON.stringify(data.data, null, 2)}</pre>`;
                } else {
                    container.innerHTML = `<div style="padding:10px;">${JSON.stringify(data)}</div>`;
                }

            } catch(e) {
                console.error(e);
            }
        }

        function toggleCode(toolName) {
            const drawer = document.getElementById('jules-drawer');
            if(!drawer.classList.contains('open')) toggleJules();
            const logArea = drawer.querySelector('.drawer-content'); // Assuming class from prev
            // Mock code fetch
            logArea.innerHTML += `<div style="color:var(--accent-color); margin-top:10px;">> Inspecting ${toolName}...</div>`;
        }

        window.onload = () => {
            loadRegistry();
            // Connect Websocket
            const ws = new WebSocket(`ws://${location.host}/ws/logs`);
            ws.onmessage = (event) => {
                const drawer = document.querySelector('#jules-drawer .drawer-content');
                if(drawer) {
                    const line = document.createElement('div');
                    line.innerText = `> ${event.data}`;
                    drawer.appendChild(line);
                    drawer.scrollTop = drawer.scrollHeight;
                }
            };
        };

        // Hotkey T for Palette
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 't') togglePalette();
        });
    </script>
</body>
</html>
