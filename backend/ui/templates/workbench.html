<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turtle Terminal - Trader Workbench</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <!-- <link rel="stylesheet" href="/static/css/trade_book.css"> (Removed) -->
    <style>
        :root {
            --bg-color: #1A1B20;
            --panel-bg: #1E1F25;
            --border-color: #3A3B45;
            --accent-color: #00bcd4;
            --text-primary: #E0E2E8;
            --splitter-width: 4px;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Menu Bar */
        #menu-bar {
            height: 30px;
            background: #121212;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 0.8em;
            flex-shrink: 0;
        }
        .menu-item { margin-right: 15px; cursor: pointer; color: #888; }
        .menu-item:hover { color: #fff; }

        /* Main Workspace Container (Flex Row) */
        #workspace-row {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* --- LEFT GROUP (Toolbox + Edge) --- */
        #left-group {
            display: flex;
            width: 300px; /* Initial Width */
            min-width: 50px;
            border-right: 1px solid var(--border-color);
        }

        /* Toolbox Panel */
        #toolbox-panel {
            width: 0px; /* Default collapsed */
            background: #151518;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.2s ease; /* Smooth toggle */
        }
        .toolbox-header {
            padding: 8px; background: #222; font-weight: bold; font-size: 0.8em;
            display: flex; justify-content: space-between; align-items: center;
        }
        .toolbox-content { flex: 1; overflow-y: auto; padding: 10px; }
        .toolbox-item {
            padding: 6px; margin-bottom: 4px; background: #2A2B33; cursor: grab; font-size: 0.85em; border-radius: 3px;
        }
        .toolbox-item:active { cursor: grabbing; }

        /* Trading Edge Panel */
        #edge-panel {
            flex: 1; /* Takes remaining space in left group */
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            min-width: 150px;
        }
        .edge-header {
            padding: 8px; background: #25262D; border-bottom: 1px solid var(--border-color);
            font-weight: bold; font-size: 0.8em; display: flex; align-items: center;
        }
        #toolbox-toggle-btn {
            background: transparent; border: none; color: #aaa; cursor: pointer; margin-right: 5px; font-weight: bold;
        }
        #toolbox-toggle-btn:hover { color: #fff; }

        .edge-metric {
            padding: 10px; border-bottom: 1px solid #2A2B33; font-size: 0.85em;
        }
        .edge-label { color: #888; display: block; margin-bottom: 4px; }
        .edge-val { font-size: 1.1em; font-weight: bold; }

        /* Splitter (Left vs Center) */
        .splitter-vertical {
            width: var(--splitter-width);
            background: #111;
            cursor: col-resize;
            flex-shrink: 0;
        }
        .splitter-vertical:hover { background: var(--accent-color); }

        /* --- CENTER GROUP (Chart + Workbook) --- */
        #center-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #chart-panel {
            flex: 1; /* Initial equal height logic handled by JS or flex */
            height: 50%;
            position: relative;
            background: #1A1B20;
        }

        .splitter-horizontal {
            height: var(--splitter-width);
            background: #111;
            cursor: row-resize;
            flex-shrink: 0;
        }
        .splitter-horizontal:hover { background: var(--accent-color); }

        #workbook-panel {
            height: 50%;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
        }

        /* Workbook Tabs */
        .workbook-tabs {
            display: flex; background: #25262D; border-bottom: 1px solid var(--border-color);
        }
        .wb-tab {
            padding: 6px 12px; font-size: 0.8em; cursor: pointer; color: #aaa; border-right: 1px solid #333;
        }
        .wb-tab.active { background: var(--panel-bg); color: #fff; }
        .wb-tab-add { padding: 6px 10px; cursor: pointer; font-weight: bold; }

        .workbook-toolbar {
            padding: 4px; background: #1E1F25; border-bottom: 1px solid #333; display: flex; justify-content: flex-end;
        }
        .wb-btn {
            background: #2A2B33; border: 1px solid #444; color: #ccc; font-size: 0.75em; padding: 2px 8px; cursor: pointer;
        }

        /* --- RIGHT GROUP (Fixed) --- */
        #right-group {
            width: 300px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .right-header {
            padding: 10px; border-bottom: 1px solid var(--border-color);
            text-align: center; font-weight: bold; color: #888; font-size: 0.85em;
        }
        .console-area {
            flex: 1; background: #111; color: #0f0; font-family: monospace; padding: 10px; overflow-y: auto; font-size: 0.85em;
        }
        .chat-area {
            height: 250px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column;
        }

    </style>
</head>
<body>

    <!-- Top Menu -->
    <div id="menu-bar">
        <div style="font-weight:bold; color:#fff; margin-right:20px;">🐢 TURTLE TERMINAL</div>
        <div class="menu-item">File</div>
        <div class="menu-item">View</div>
        <div class="menu-item">Help</div>
    </div>

    <!-- Workspace -->
    <div id="workspace-row">

        <!-- LEFT GROUP -->
        <div id="left-group">
            <!-- Panel A: Toolbox (Hidden by default) -->
            <div id="toolbox-panel">
                <div class="toolbox-header">
                    <span>TOOLBOX</span>
                    <span style="cursor:pointer;" onclick="toggleToolbox()">✕</span>
                </div>
                <div class="toolbox-content" id="toolbox-content">
                    <!-- Populated by toolbox.js -->
                </div>
            </div>

            <!-- Splitter (internal to left group, optional if we want resize between toolbox/edge) -->
            <!-- For MVP, let's keep toolbox fixed width when open or just toggle.
                 Prompt says "width adjustable relative to toolbox (via splitter)".
                 Adding internal splitter. -->
            <div class="splitter-vertical" id="split-left-internal" style="display:none;"></div>

            <!-- Panel B: Trading Edge -->
            <div id="edge-panel">
                <div class="edge-header">
                    <button id="toolbox-toggle-btn" onclick="toggleToolbox()">»</button>
                    <span>TRADING EDGE</span>
                </div>
                <div id="edge-content">
                    <div class="edge-metric"><span class="edge-label">Sentiment</span><span class="edge-val" id="val-sentiment">--</span></div>
                    <div class="edge-metric"><span class="edge-label">Regime</span><span class="edge-val" id="val-regime">--</span></div>
                    <div class="edge-metric"><span class="edge-label">Index PE</span><span class="edge-val" id="val-pe">--</span></div>
                    <div class="edge-metric"><span class="edge-label">ATM Straddle</span><span class="edge-val" id="val-straddle">--</span></div>
                    <div class="edge-metric"><span class="edge-label">ATM IV</span><span class="edge-val" id="val-iv">--</span></div>
                </div>
            </div>
        </div>

        <!-- Main Splitter -->
        <div class="splitter-vertical" id="split-main"></div>

        <!-- CENTER GROUP -->
        <div id="center-group">
            <!-- Chart Workbench -->
            <div id="chart-panel">
                <div id="chartContainer" style="width:100%; height:100%;"></div>
            </div>

            <!-- Splitter -->
            <div class="splitter-horizontal" id="split-center"></div>

            <!-- Excel Workbook -->
            <div id="workbook-panel">
                <div class="workbook-tabs">
                    <div class="wb-tab active">Run 1</div>
                    <div class="wb-tab">Run 2</div>
                    <div class="wb-tab-add">+</div>
                </div>
                <div class="workbook-toolbar">
                    <button class="wb-btn" onclick="wbShowOnChart()">Show on Chart</button>
                    <button class="wb-btn" style="margin-left:5px;">Export CSV</button>
                </div>
                <div id="workbook-grid" style="flex:1; overflow:hidden;">
                    <!-- Grid rendered by workbook.js -->
                </div>
            </div>
        </div>

        <!-- Right Group (Fixed) -->
        <div id="right-group">
            <div class="right-header">PYTHON CONSOLE</div>
            <div class="console-area">
                >>> System Ready.<br>
                >>> Edge Feed Connected.<br>
                >>> _
            </div>
            <div class="right-header" style="border-top:1px solid #333;">JULES CHAT</div>
            <div class="chat-area" id="chat-history" style="flex:1; background:#202020; padding:10px; overflow-y:auto;">
                <!-- Chat messages -->
            </div>
            <div style="padding:10px; background:#25262D;">
                <input type="text" placeholder="Ask Jules..." style="width:100%; background:#111; border:1px solid #444; color:#fff; padding:6px; box-sizing: border-box;" id="chat-input">
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="/static/js/toolbox.js"></script>
    <script src="/static/js/edge.js"></script>
    <script src="/static/js/tabs/turtle_tab.js"></script>
    <script src="/static/js/tabs/statarb_tab.js"></script>
    <script src="/static/js/symbol_search.js"></script>
    <script src="/static/js/chart_manager.js"></script>
    <script src="/static/js/workbook_manager.js"></script>
    <script src="/static/js/jules_chat.js"></script>
    <script src="/static/js/layout.js"></script> <!-- New layout manager -->
</body>
</html>
