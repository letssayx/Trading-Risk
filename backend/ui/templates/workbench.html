<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jules Sovereign Workbench - Slate & Carbon</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2d2d2d;
            --border-color: #424242;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --accent-color: #00bcd4;
            --header-height: 40px;
            --palette-width: 280px;
        }
        body { margin: 0; font-family: 'Consolas', 'Segoe UI', monospace; background: var(--bg-color); color: var(--text-primary); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Top Menu Bar */
        #menu-bar { height: var(--header-height); background: #121212; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 15px; font-size: 0.85em; user-select: none; }
        .brand { font-weight: bold; color: var(--accent-color); margin-right: 30px; letter-spacing: 1px; cursor: default; }
        .menu-item { margin-right: 20px; cursor: pointer; color: var(--text-secondary); transition: color 0.2s; position: relative; }
        .menu-item:hover { color: #fff; }
        .menu-item:active { top: 1px; }

        /* Workbench Tabs */
        #wb-tabs { display: flex; align-items: center; margin-left: auto; }
        .wb-tab { padding: 5px 12px; background: #222; border: 1px solid #333; margin-left: 5px; border-radius: 2px; cursor: pointer; font-size: 0.8em; color: #888; }
        .wb-tab.active { background: var(--panel-bg); border-color: var(--accent-color); color: #fff; }

        /* Main Layout */
        #app-body { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* Alpha Palette (Collapsible) */
        #alpha-palette { width: 0; background: #181818; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: width 0.3s cubic-bezier(0.4,0,0.2,1); overflow: hidden; white-space: nowrap; }
        #alpha-palette.open { width: var(--palette-width); }
        .palette-header { padding: 12px; background: #121212; color: var(--accent-color); font-weight: bold; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .palette-content { flex: 1; overflow-y: auto; padding: 10px; }

        .tool-category { font-size: 0.75em; color: #666; margin-top: 15px; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; border-bottom: 1px solid #333; padding-bottom: 2px; }
        .tool-brick { background: #252525; border: 1px solid #333; padding: 8px 10px; margin-bottom: 6px; border-radius: 2px; cursor: grab; font-size: 0.85em; display: flex; align-items: center; transition: all 0.2s; }
        .tool-brick:hover { background: #333; border-color: var(--accent-color); transform: translateX(2px); }
        .brick-icon { margin-right: 10px; opacity: 0.8; font-size: 1.1em; width: 20px; text-align: center; }

        /* Canvas Area */
        #canvas-area { flex: 1; background: var(--bg-color); position: relative; padding: 20px; overflow: auto; display: grid; grid-template-columns: repeat(12, 1fr); gap: 15px; grid-auto-rows: 300px; }
        .canvas-widget { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 4px; display: flex; flex-direction: column; position: relative; grid-column: span 6; }
        .widget-header { padding: 6px 10px; background: #222; border-bottom: 1px solid #333; font-size: 0.8em; display: flex; justify-content: space-between; align-items: center; cursor: move; }
        .widget-body { flex: 1; overflow: hidden; position: relative; }

        /* Floating Action Button for Palette */
        #fab-palette { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 20px; height: 60px; background: #333; border: 1px solid #444; border-left: none; border-radius: 0 4px 4px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--accent-color); z-index: 1000; transition: left 0.3s; }
        #alpha-palette.open + #canvas-area #fab-palette { left: var(--palette-width); } /* Not strictly needed if flex, but good for overlay */

        /* Jules Drawer */
        #jules-drawer { width: 300px; background: #151515; border-left: 1px solid var(--border-color); display: flex; flex-direction: column; transition: transform 0.3s; position: fixed; right: 0; top: var(--header-height); bottom: 0; transform: translateX(100%); z-index: 2000; }
        #jules-drawer.open { transform: translateX(0); }

        /* Chat Widget */
        #chat-widget {
            position: fixed;
            right: 16px;
            bottom: 16px;
            width: 280px;
            max-height: 360px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            font-size: 0.8em;
            z-index: 2500;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
        }
        #chat-header {
            padding: 6px 8px;
            background: #202020;
            border-bottom: 1px solid #333;
            color: var(--accent-color);
            font-weight: bold;
        }
        #chat-messages {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
            color: #ccc;
        }
        .chat-line {
            margin-bottom: 4px;
        }
        .chat-line span.sender {
            color: var(--accent-color);
            margin-right: 4px;
        }
        #chat-input-row {
            display: flex;
            border-top: 1px solid #333;
        }
        #chat-input {
            flex: 1;
            padding: 6px 8px;
            border: none;
            background: #202020;
            color: #eee;
            font-family: inherit;
            font-size: 0.8em;
        }
        #chat-input:focus { outline: none; }
        #chat-send {
            padding: 0 10px;
            border: none;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        #chat-send:hover { filter: brightness(1.1); }

    </style>
</head>
<body>

    <div id="menu-bar">
        <div class="brand">TURTLE WORKBENCH</div>
        <div class="menu-item" onclick="onFileDataClick()">FILE / DATA</div>
        <div class="menu-item" onclick="onAnalyticsClick()">ANALYTICS</div>
        <div class="menu-item" onclick="onViewClick()">VIEW</div>

        <div id="wb-tabs">
            <div class="wb-tab active" data-tab="pnl">PnL Tracker</div>
            <div class="wb-tab" data-tab="risk">Risk Scorecard</div>
            <div class="wb-tab" data-tab="flow">Order Flow</div>
            <div class="wb-tab wb-tab-add" style="color:var(--accent-color)">+</div>
        </div>

        <div class="menu-item" style="margin-left:20px; font-size:1.2em;" onclick="toggleJules()">🤖</div>
    </div>

    <div id="app-body">
        <!-- Alpha Palette -->
        <div id="alpha-palette" class="open">
            <div class="palette-header">
                <span>ALPHA PALETTE</span>
                <span style="cursor:pointer; opacity:0.6;" onclick="togglePalette()">«</span>
            </div>
            <div class="palette-content" id="palette-list">
                <div style="text-align:center; color:#555; padding:20px;">Loading Registry...</div>
            </div>
        </div>

        <!-- Canvas (filled dynamically per Workbench tab) -->
        <div id="canvas-area"></div>
    </div>

    <!-- Jules Drawer -->
    <div id="jules-drawer">
        <div style="padding:10px; border-bottom:1px solid #333; font-weight:bold; color:var(--accent-color);">JULES PYTHON HUB</div>
        <div id="jules-log" style="flex:1; padding:10px; font-family:monospace; color:#0f0; font-size:0.85em; overflow-y:auto;">
            > System Ready.<br>
            > Alpha Palette Loaded.<br>
            > Monitoring Canvas...
        </div>
    </div>

    <!-- Chat Widget -->
    <div id="chat-widget">
        <div id="chat-header">Jules Chat</div>
        <div id="chat-messages">
            <div class="chat-line"><span class="sender">Jules</span><span>Welcome to the Workbench. Ask anything about this dashboard here.</span></div>
        </div>
        <div id="chat-input-row">
            <input id="chat-input" type="text" placeholder="Ask Jules..." onkeydown="if(event.key==='Enter'){sendChat();}">
            <button id="chat-send" onclick="sendChat()">Send</button>
        </div>
    </div>

    <script>
        // State
        let paletteOpen = true;
        let julesOpen = false;
        let activeTab = 'pnl';
        let dynamicWorkbenchCount = 0;

        function togglePalette() {
            const p = document.getElementById('alpha-palette');
            paletteOpen = !paletteOpen;
            p.className = paletteOpen ? 'open' : '';
        }

        function toggleJules() {
            const j = document.getElementById('jules-drawer');
            julesOpen = !julesOpen;
            j.className = julesOpen ? 'open' : '';
        }

        function appendJulesLog(message) {
            const log = document.getElementById('jules-log');
            const line = document.createElement('div');
            line.textContent = `> ${message}`;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }

        // Menu actions wired to backend routes
        async function onFileDataClick() {
            try {
                const res = await fetch('/strategies/toolbox/registry');
                appendJulesLog(`FILE/DATA -> /strategies/toolbox/registry [${res.status}]`);
            } catch (e) {
                console.error(e);
                appendJulesLog('FILE/DATA error: unable to reach backend.');
            }
        }

        async function onAnalyticsClick() {
            try {
                const payload = { returns_matrix: [[0.01, -0.02, 0.015], [0.005, 0.0, -0.01]] };
                const res = await fetch('/strategies/macro/pca', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                appendJulesLog(`ANALYTICS -> /strategies/macro/pca [${res.status}]`);
            } catch (e) {
                console.error(e);
                appendJulesLog('ANALYTICS error: unable to reach backend.');
            }
        }

        async function onViewClick() {
            try {
                const res = await fetch('/portfolio');
                appendJulesLog(`VIEW -> /portfolio [${res.status}]`);
            } catch (e) {
                console.error(e);
                appendJulesLog('VIEW error: unable to reach backend.');
            }
        }

        async function loadRegistry() {
            try {
                const res = await fetch('/strategies/toolbox/registry');
                if (!res.ok) throw new Error("API Error");
                const data = await res.json();
                renderPalette(data.tools);
            } catch(e) {
                console.error(e);
                document.getElementById('palette-list').innerHTML = `<div style="color:red; text-align:center;">Registry Error</div>`;
            }
        }

        function renderPalette(tools) {
            const container = document.getElementById('palette-list');
            container.innerHTML = '';

            // Group tools logic (Layers, Filters, Brushes, Judges)
            // Mapping Category -> Palette Group
            const groups = {
                "Strategy": "LAYERS (Strategies)",
                "Risk": "FILTERS (Risk Models)",
                "Indicator": "BRUSHES (Intelligence)",
                "Governance": "JUDGES (Audit)",
                "Math": "UTILS"
            };

            const bucketed = {};
            tools.forEach(t => {
                const grp = groups[t.category] || "OTHERS";
                if (!bucketed[grp]) bucketed[grp] = [];
                bucketed[grp].push(t);
            });

            // Render
            // Order: Layers, Brushes, Filters, Judges
            const order = ["LAYERS (Strategies)", "BRUSHES (Intelligence)", "FILTERS (Risk Models)", "JUDGES (Audit)", "UTILS", "OTHERS"];

            order.forEach(grpName => {
                if (!bucketed[grpName]) return;

                const catHeader = document.createElement('div');
                catHeader.className = 'tool-category';
                catHeader.innerText = grpName;
                container.appendChild(catHeader);

                bucketed[grpName].forEach(tool => {
                    const el = document.createElement('div');
                    el.className = 'tool-brick';
                    el.draggable = true;
                    el.innerHTML = `<span class="brick-icon">${tool.icon}</span> ${tool.title}`;
                    container.appendChild(el);
                });
            });
        }

        // Workbench rendering
        function renderPnlWorkbench() {
            const canvas = document.getElementById('canvas-area');
            canvas.innerHTML = '';

            // Main PnL chart
            const mainWidget = document.createElement('div');
            mainWidget.className = 'canvas-widget';
            mainWidget.style.gridColumn = 'span 8';
            mainWidget.style.gridRow = 'span 2';
            mainWidget.innerHTML = `
                <div class="widget-header">
                    <span>PnL Tracker</span>
                    <span style="color:#666;">Sample Equity Curve</span>
                </div>
                <div class="widget-body" id="chart-pnl-main"></div>
            `;
            canvas.appendChild(mainWidget);

            // Secondary PnL widget
            const sideWidget = document.createElement('div');
            sideWidget.className = 'canvas-widget';
            sideWidget.style.gridColumn = 'span 4';
            sideWidget.style.gridRow = 'span 1';
            sideWidget.innerHTML = `
                <div class="widget-header">Daily PnL Heatmap</div>
                <div class="widget-body" style="padding:10px; color:#888;">Coming soon – connects to your portfolio PnL.</div>
            `;
            canvas.appendChild(sideWidget);

            // Chart
            const chartDiv = document.getElementById('chart-pnl-main');
            const chart = LightweightCharts.createChart(chartDiv, {
                width: chartDiv.clientWidth,
                height: chartDiv.clientHeight,
                layout: { background: { color: '#2d2d2d' }, textColor: '#ccc' },
                grid: { vertLines: { color: '#333'}, horzLines: { color: '#333'} }
            });
            chart.addAreaSeries({ lineColor: '#00bcd4', topColor: 'rgba(0,188,212,0.3)', bottomColor: 'rgba(0,188,212,0.05)' }).setData([
                { time: '2023-01-01', value: 100 },
                { time: '2023-01-02', value: 103 },
                { time: '2023-01-03', value: 107 },
                { time: '2023-01-04', value: 104 },
                { time: '2023-01-05', value: 111 },
            ]);
        }

        function renderRiskWorkbench() {
            const canvas = document.getElementById('canvas-area');
            canvas.innerHTML = '';

            const riskWidget = document.createElement('div');
            riskWidget.className = 'canvas-widget';
            riskWidget.style.gridColumn = 'span 6';
            riskWidget.style.gridRow = 'span 2';
            riskWidget.innerHTML = `
                <div class="widget-header">
                    <span>Risk Scorecard</span>
                    <span style="color:#666;">Sample VaR Timeline</span>
                </div>
                <div class="widget-body" id="chart-risk-var"></div>
            `;
            canvas.appendChild(riskWidget);

            const heatWidget = document.createElement('div');
            heatWidget.className = 'canvas-widget';
            heatWidget.style.gridColumn = 'span 6';
            heatWidget.style.gridRow = 'span 2';
            heatWidget.innerHTML = `
                <div class="widget-header">Exposure Breakdown</div>
                <div class="widget-body" style="padding:10px; color:#888;">Sector and factor risk views will appear here.</div>
            `;
            canvas.appendChild(heatWidget);

            const chartDiv = document.getElementById('chart-risk-var');
            const chart = LightweightCharts.createChart(chartDiv, {
                width: chartDiv.clientWidth,
                height: chartDiv.clientHeight,
                layout: { background: { color: '#2d2d2d' }, textColor: '#ccc' },
                grid: { vertLines: { color: '#333'}, horzLines: { color: '#333'} }
            });
            chart.addLineSeries({ color: '#ff9800' }).setData([
                { time: '2023-01-01', value: 1.2 },
                { time: '2023-01-02', value: 1.5 },
                { time: '2023-01-03', value: 1.1 },
                { time: '2023-01-04', value: 1.8 },
                { time: '2023-01-05', value: 1.3 },
            ]);
        }

        function renderFlowWorkbench() {
            const canvas = document.getElementById('canvas-area');
            canvas.innerHTML = '';

            const flowWidget = document.createElement('div');
            flowWidget.className = 'canvas-widget';
            flowWidget.style.gridColumn = 'span 8';
            flowWidget.style.gridRow = 'span 2';
            flowWidget.innerHTML = `
                <div class="widget-header">
                    <span>Order Flow</span>
                    <span style="color:#666;">Sample Volume Ladder</span>
                </div>
                <div class="widget-body" id="chart-flow-main"></div>
            `;
            canvas.appendChild(flowWidget);

            const tapeWidget = document.createElement('div');
            tapeWidget.className = 'canvas-widget';
            tapeWidget.style.gridColumn = 'span 4';
            tapeWidget.style.gridRow = 'span 2';
            tapeWidget.innerHTML = `
                <div class="widget-header">Tape Monitor</div>
                <div class="widget-body" style="padding:10px; color:#888;">Recent prints and imbalance will show here.</div>
            `;
            canvas.appendChild(tapeWidget);

            const chartDiv = document.getElementById('chart-flow-main');
            const chart = LightweightCharts.createChart(chartDiv, {
                width: chartDiv.clientWidth,
                height: chartDiv.clientHeight,
                layout: { background: { color: '#2d2d2d' }, textColor: '#ccc' },
                grid: { vertLines: { color: '#333'}, horzLines: { color: '#333'} }
            });
            chart.addHistogramSeries({ color: '#4caf50' }).setData([
                { time: '2023-01-01', value: 1200 },
                { time: '2023-01-02', value: 1800 },
                { time: '2023-01-03', value: 900 },
                { time: '2023-01-04', value: 2100 },
                { time: '2023-01-05', value: 1600 },
            ]);
        }

        function renderActiveWorkbench() {
            if (activeTab === 'pnl') renderPnlWorkbench();
            else if (activeTab === 'risk') renderRiskWorkbench();
            else if (activeTab === 'flow') renderFlowWorkbench();
        }

        function setActiveTab(tabKey) {
            activeTab = tabKey;
            document.querySelectorAll('#wb-tabs .wb-tab').forEach(t => {
                if (!t.dataset.tab) return;
                t.classList.toggle('active', t.dataset.tab === tabKey);
            });
            renderActiveWorkbench();
        }

        function setupTabs() {
            document.querySelectorAll('#wb-tabs .wb-tab').forEach(t => {
                const tabKey = t.dataset.tab;
                if (tabKey) {
                    t.addEventListener('click', () => setActiveTab(tabKey));
                }
            });
            const addTab = document.querySelector('#wb-tabs .wb-tab-add');
            if (addTab) {
                addTab.addEventListener('click', () => {
                    dynamicWorkbenchCount += 1;
                    const newKey = `wb${dynamicWorkbenchCount}`;
                    const newTab = document.createElement('div');
                    newTab.className = 'wb-tab';
                    newTab.dataset.tab = newKey;
                    newTab.textContent = `Custom ${dynamicWorkbenchCount}`;
                    addTab.before(newTab);
                    newTab.addEventListener('click', () => setActiveTab(newKey));
                    // For now, custom tabs reuse the PnL layout
                    setActiveTab(newKey);
                });
            }
        }

        // Chat widget
        function appendChatMessage(sender, text) {
            const box = document.getElementById('chat-messages');
            const line = document.createElement('div');
            line.className = 'chat-line';
            line.innerHTML = `<span class="sender">${sender}</span><span>${text}</span>`;
            box.appendChild(line);
            box.scrollTop = box.scrollHeight;
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            appendChatMessage('You', text);
            input.value = '';

            // Local, UI-only Jules response
            appendChatMessage('Jules', "I see your message here on the dashboard. For deeper reasoning, keep chatting with me in the IDE.");
        }

        // Init
        window.onload = () => {
            loadRegistry();
            setupTabs();
            renderActiveWorkbench();
        };

        // Hotkey T for Palette
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 't') togglePalette();
        });
    </script>
</body>
</html>
