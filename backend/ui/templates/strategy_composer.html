<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turtle Terminal - Strategy Composer</title>
    <link rel="stylesheet" href="/static/css/strategy_composer.css">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #121212; color: #e0e0e0; }

        #top-bar { height: 40px; background: #121212; border-bottom: 1px solid #333; display: flex; align-items: center; padding: 0 15px; }
        .logo { font-weight: bold; margin-right: 20px; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="logo" onclick="location.href='/workbench'">← Back to Workbench</div>
        <div style="font-weight:bold; color:#888;">STRATEGY COMPOSER</div>
    </div>

    <div class="composer-toolbar">
        <button class="btn btn-primary" id="save-strategy-btn">Save Strategy</button>
        <button class="btn" id="backtest-btn">Run Backtest</button>
        <div style="flex:1"></div>
        <button class="btn" onclick="location.reload()">Clear Canvas</button>
    </div>

    <div class="composer-container">
        <!-- Palette -->
        <div class="palette">
            <div class="palette-header">Filters</div>
            <div class="palette-section">
                <div class="palette-item filter" draggable="true" data-type="filter">Z-Score Filter</div>
                <div class="palette-item filter" draggable="true" data-type="filter">ATR Filter</div>
                <div class="palette-item filter" draggable="true" data-type="filter">RSI Filter</div>
                <div class="palette-item filter" draggable="true" data-type="filter">Volume Filter</div>
            </div>

            <div class="palette-header">Indicators</div>
            <div class="palette-section">
                <div class="palette-item indicator" draggable="true" data-type="indicator">SMA Crossover</div>
                <div class="palette-item indicator" draggable="true" data-type="indicator">Bollinger Bands</div>
                <div class="palette-item indicator" draggable="true" data-type="indicator">MACD Signal</div>
            </div>

            <div class="palette-header">Logic</div>
            <div class="palette-section">
                <div class="palette-item logic" draggable="true" data-type="logic">AND Gate</div>
                <div class="palette-item logic" draggable="true" data-type="logic">OR Gate</div>
                <div class="palette-item logic" draggable="true" data-type="logic">NOT Gate</div>
            </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-area" id="composer-canvas">
            <svg id="connections-layer"></svg>
            <div class="drop-zone"></div>
        </div>
    </div>

    <script src="/static/js/strategy_composer.js"></script>
</body>
</html>
