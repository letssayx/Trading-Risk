<script>
    const formatDateTime = (dateStr) => {
        if (!dateStr || dateStr === '-') return { date: '-', time: null };
        try {
            let dt = new Date(dateStr);
            if (isNaN(dt.getTime())) return { date: dateStr, time: null };

            let y = dt.getFullYear(), m = ('0' + (dt.getMonth() + 1)).slice(-2), dy = ('0' + dt.getDate()).slice(-2);
            let datePart = `${y}-${m}-${dy}`;

            let timePart = null;
            if (typeof dateStr === 'string') {
                 let hasTime = dateStr.includes('T') || dateStr.includes(' ');
                 if (hasTime) {
                     let parts = dateStr.split(/[T ]/);
                     if (parts.length > 1) {
                         timePart = parts[1].split('+')[0].split('.')[0];
                     }
                 }
            }

            return { date: datePart, time: timePart };
        } catch(e) {
            return { date: dateStr, time: null };
        }
    };

    console.log(formatDateTime("2026-05-24T12:10:46"));
    console.log(formatDateTime("2026-05-24T12:10:46+00:00"));
    console.log(formatDateTime("2026-05-24 12:10:46"));
</script>
