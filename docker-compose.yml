version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg14
    container_name: turtle_db
    environment:
      - POSTGRES_USER=jules
      - POSTGRES_PASSWORD=jules123
      - POSTGRES_DB=turtle_db
    ports:
      - "5432:5432"
    volumes:
      - turtle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jules -d turtle_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: turtle_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  turtle_pgdata:
