<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jules Data Ingestion Hub</title>
    <style>
        body { background: #1e1e1e; color: #00ff00; font-family: monospace; padding: 20px; }
        h3 { border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
        #drop-zone {
            border: 2px dashed #00ff00;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
        }
        #drop-zone.hover { background-color: #333; }
        .log-console {
            background: #000;
            border: 1px solid #333;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            margin-top: 20px;
        }
        .status-ready { color: #00ff00; }
        .status-error { color: #ff0000; }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #33ff33; }
    </style>
</head>
<body>

    <h3>> DATA_INGESTION_MODULE_V1</h3>

    <div id="drop-zone">
        [ DRAG EXCHANGE CSV FILES HERE ]
        <br><br>
        <small>Supports: Participant-wise OI, Bhavcopy, Tick Data</small>
        <input type="file" id="fileInput" style="display:none;" multiple>
    </div>

    <div id="file-queue">
        <strong>> PENDING_UPLOADS:</strong>
        <ul id="file-list"></ul>
    </div>

    <button onclick="executeIngestion()">EXECUTE_INGESTION</button>

    <div class="log-console" id="console-output">
        > SYSTEM_READY...
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('file-list');
        let filesToUpload = [];

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('hover');
        });

        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            for (let file of files) {
                filesToUpload.push(file);
                let li = document.createElement('li');
                li.textContent = `${file.name} (${(file.size/1024).toFixed(1)} KB) - READY`;
                fileList.appendChild(li);
                log(`File staged: ${file.name}`);
            }
        }

        function log(msg) {
            const consoleOut = document.getElementById('console-output');
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            consoleOut.appendChild(div);
            consoleOut.scrollTop = consoleOut.scrollHeight;
        }

        async function executeIngestion() {
            if (filesToUpload.length === 0) {
                log("ERROR: No files to upload.");
                return;
            }

            // Mock Authentication Token (In real app, retrieve from localStorage)
            const token = "trader";

            for (let file of filesToUpload) {
                log(`Uploading ${file.name}...`);

                let formData = new FormData();
                formData.append("file", file);

                try {
                    let response = await fetch('/api/ingest/derivative-data', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        },
                        body: formData
                    });

                    if (response.ok) {
                        let result = await response.json();
                        log(`SUCCESS: ${result.message} (ID: ${result.upload_id})`);
                    } else {
                        let err = await response.json();
                        log(`FAILED: ${err.detail}`);
                    }
                } catch (e) {
                    log(`NETWORK_ERROR: ${e.message}`);
                }
            }
            filesToUpload = [];
            fileList.innerHTML = '';
        }
    </script>
</body>
</html>
