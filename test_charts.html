<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
<div id="chart" style="width: 800px; height: 600px;"></div>
<script>
    var chartDom = document.getElementById('chart');
    var myChart = echarts.init(chartDom);
    var option = {
        backgroundColor: '#222',
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'shadow' }
        },
        grid: [
            { left: '5%', right: '55%', bottom: '5%', top: '10%', containLabel: true },
            { left: '45%', right: '45%', bottom: '5%', top: '10%', containLabel: false },
            { left: '55%', right: '5%', bottom: '5%', top: '10%', containLabel: true }
        ],
        xAxis: [
            { type: 'value', gridIndex: 0, inverse: true },
            { type: 'value', gridIndex: 2 }
        ],
        yAxis: [
            { type: 'category', gridIndex: 0, data: ['1', '2', '3'] },
            { type: 'category', gridIndex: 1, data: ['1', '2', '3'] },
            { type: 'category', gridIndex: 2, data: ['1', '2', '3'] }
        ],
        series: [
            { type: 'bar', xAxisIndex: 0, yAxisIndex: 0, data: [100, 200, 300] },
            { type: 'bar', xAxisIndex: 1, yAxisIndex: 2, data: [150, 250, 350] }
        ]
    };
    myChart.setOption(option);
</script>
</body>
</html>
